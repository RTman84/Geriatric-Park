name: Android debug build

# Builds an installable debug APK in the cloud so no local Android setup is needed.
# Run it from GitHub: Actions -> "Android debug build" -> Run workflow, then download the
# "geriatric-park-debug-apk" artifact from the finished run and install it on a phone.
on:
  workflow_dispatch:
  push:
    branches:
      - phase2/account-backend-foundation-clean
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.env.native'
      - 'package.json'
      - 'package-lock.json'
      - 'services/**'
      - 'components/**'
      - 'App.tsx'
      - 'constants.tsx'
      - 'index.html'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build the native web bundle (AdSense stripped, native API base URL)
        run: npm run build:native

      - name: Sync into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The GitHub runner already ships the Android SDK; just accept licenses and make sure API 36 is there.
      - name: Prepare Android SDK
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || echo "sdkmanager step failed; Gradle will try to fetch what it needs"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: geriatric-park-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
