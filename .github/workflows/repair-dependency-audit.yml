name: Repair dependency audit

on:
  push:
    branches:
      - phase2/account-backend-foundation-clean

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'chore: apply npm audit fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe npm audit fixes
        run: npm audit fix --package-lock-only
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes produced by npm audit fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: apply npm audit fixes'
          git push
