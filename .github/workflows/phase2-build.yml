name: Phase 2 build check

on:
  push:
    branches:
      - phase2/account-backend-foundation-clean
  pull_request:
    branches:
      - main
      - phase2/account-backend-foundation-clean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
