name: Android release build (signed)

# Builds a SIGNED Play Store bundle (.aab) and a signed installable .apk from the real AdMob ad unit.
# Run it by hand: GitHub -> Actions -> "Android release build (signed)" -> Run workflow.
# Needs 4 repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# and 2 account-connection secrets (public values, copied from Supabase -> Project Settings -> API):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Each Play upload needs a HIGHER version code than the last one.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (whole number, must be higher than the last Play upload)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to players (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Check the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "Missing a signing secret ($v). Add all four secrets first."; exit 1; fi
          done

      - name: Check the account connection values exist (without them the app has no sign-in)
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY repository secret. Add both (Supabase -> Project Settings)."; exit 1; fi
          # Forgive copy/paste noise: spaces, line breaks, quotes, a trailing slash or a leftover /rest/v1.
          CLEAN=$(python3 -c 'import os,re; u=os.environ["SB_URL"]; u=re.sub(r"[\s\"\x27]","",u); u=re.sub(r"/rest/v1/*$","",u); print(u.rstrip("/"))')
          if ! echo "$CLEAN" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "VITE_SUPABASE_URL is set but is not a Supabase project address. It must look like https://abcdefgh.supabase.co"
            echo "What was found (values are never printed): length=${#SB_URL}, starts with https://: $(case "$SB_URL" in https://*) echo yes;; *) echo no;; esac), contains .supabase.co: $(case "$SB_URL" in *.supabase.co*) echo yes;; *) echo no;; esac), starts like a key (sb_ or eyJ): $(case "$SB_URL" in sb_*|eyJ*) echo YES-you-pasted-a-key-here;; *) echo no;; esac), contains supabase.com/dashboard: $(case "$SB_URL" in *supabase.com*) echo YES-wrong-address;; *) echo no;; esac)"
            exit 1
          fi
          case "$SB_KEY" in sb_secret_*|*service_role*) echo "VITE_SUPABASE_PUBLISHABLE_KEY looks like a SECRET key. Use the PUBLISHABLE key only."; exit 1;; esac
          echo "VITE_SUPABASE_URL_CLEAN=$CLEAN" >> "$GITHUB_ENV"
          echo "Account connection values look good."

      - name: Build the native web bundle with the REAL ad unit
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL_CLEAN }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:native:release

      - name: Sync into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || echo "sdkmanager step failed; Gradle will try to fetch what it needs"

      - name: Decode the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: geriatric-park-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: geriatric-park-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
